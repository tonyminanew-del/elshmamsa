<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>الرئيسية - مدرسة الشمامسة</title>

    <!-- ================= FONTS ================= -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,700&family=Tajawal:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- ================= ICONS ================= -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- ================= FIREBASE ================= -->

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>


    <style>

        /* =====================================================
           ROOT
        ===================================================== */

        :root {

            --navy: #172554;
            --navy-light: #28418f;

            --maroon: #741b24;
            --maroon-light: #9b3039;

            --gold: #c79a32;
            --gold-light: #f2d889;

            --green: #16a34a;
            --red: #dc2626;

            --bg: #f5f7fb;
            --white: #ffffff;

            --text: #182033;
            --muted: #858c9b;

            --border: #e9edf3;

            --shadow: 0 15px 45px rgba(23, 37, 84, .08);

        }


        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 90% 0%, rgba(199, 154, 50, .08), transparent 28%),
                radial-gradient(circle at 0% 35%, rgba(23, 37, 84, .055), transparent 30%),
                var(--bg);
            color: var(--text);
            font-family: "Tajawal", sans-serif;
            padding-bottom: 110px;
        }

        a { text-decoration: none; color: inherit; }
        button { font-family: inherit; cursor: pointer; }

        /* =====================================================
           PAGE
        ===================================================== */

        .page {
            width: min(760px, calc(100% - 22px));
            margin: auto;
        }

        /* =====================================================
           TOP BAR
        ===================================================== */

        .topbar {
            margin-top: 12px;
            height: 70px;
            padding: 9px 12px;
            background: rgba(255, 255, 255, .95);
            border: 1px solid rgba(23, 37, 84, .07);
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 35px rgba(23, 37, 84, .07);
            backdrop-filter: blur(20px);
            position: relative;
            z-index: 20;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .brand-logo {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            border-radius: 17px;
            display: grid;
            place-items: center;
            color: white;
            font-size: 21px;
            background: linear-gradient(145deg, var(--navy), var(--navy-light));
            box-shadow: 0 9px 22px rgba(23, 37, 84, .2);
        }

        .brand-text { min-width: 0; }

        .brand-text h1 {
            font-family: "Amiri", serif;
            font-size: 18px;
            line-height: 1.3;
            color: var(--navy);
        }

        .brand-text p {
            margin-top: 3px;
            font-size: 10px;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 360px;
        }

        .top-btn {
            width: 43px;
            height: 43px;
            border-radius: 15px;
            border: 1px solid var(--border);
            background: white;
            color: var(--navy);
            display: grid;
            place-items: center;
            transition: .2s;
            position: relative;
            flex-shrink: 0;
        }

        .top-btn:active { transform: scale(.93); }

        .notif-dot {
            display: none;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--red);
            border: 2px solid white;
            position: absolute;
            top: 7px;
            right: 7px;
        }

        /* =====================================================
           MAIN HERO
        ===================================================== */

        .main-hero {
            margin-top: 14px;
            position: relative;
            overflow: hidden;
            padding: 30px 26px;
            border-radius: 34px;
            color: white;
            text-align: center;
            background:
                radial-gradient(circle at 8% 10%, rgba(255, 255, 255, .15), transparent 25%),
                radial-gradient(circle at 95% 95%, rgba(199, 154, 50, .25), transparent 32%),
                linear-gradient(135deg, #121d45, #263d87 52%, #641c25);
            box-shadow: 0 22px 55px rgba(23, 37, 84, .19);
            animation: heroIn .65s ease both;
        }

        .main-hero::before {
            content: "";
            position: absolute;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, .08);
            left: -150px;
            bottom: -150px;
        }

        .main-hero::after {
            content: "";
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, .06);
            right: -180px;
            top: -190px;
        }

        .hero-content {
            position: relative;
            z-index: 3;
        }

        .hero-avatar {
            width: 84px;
            height: 84px;
            margin: 0 auto 16px;
            border-radius: 27px;
            overflow: hidden;
            display: grid;
            place-items: center;
            background: rgba(255, 255, 255, .12);
            border: 2px solid rgba(255, 255, 255, .55);
            box-shadow: 0 12px 30px rgba(0, 0, 0, .15);
        }

        .hero-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .welcome-title {
            font-family: "Amiri", serif;
            font-size: 26px;
            line-height: 1.3;
            font-weight: 700;
        }

        .welcome-title span { color: var(--gold-light); }

        .welcome-title.error-msg {
            color: #ffb4ac;
            font-size: 17px;
        }

        .welcome-sub {
            margin-top: 6px;
            font-size: 12px;
            opacity: .72;
        }

        /* =====================================================
           SECTION HEAD
        ===================================================== */

        .section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 25px 4px 11px;
        }

        .section-head .head-left {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .section-head .icon-badge {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border-radius: 13px;
            color: white;
            font-size: 15px;
            background: linear-gradient(145deg, var(--maroon-light), var(--maroon));
            flex-shrink: 0;
        }

        .section-head h2 {
            font-family: "Amiri", serif;
            font-size: 21px;
            color: var(--navy);
        }

        .section-head p {
            margin-top: 2px;
            font-size: 10.5px;
            color: var(--muted);
        }

        /* =====================================================
           VERSE CARD
        ===================================================== */

        .verse {
            position: relative;
            overflow: hidden;
            background: white;
            border: 1px solid var(--border);
            border-radius: 29px;
            padding: 25px 22px;
            box-shadow: var(--shadow);
        }

        .verse::before {
            content: "\201C";
            position: absolute;
            left: 12px;
            top: -12px;
            font-family: "Amiri", serif;
            font-size: 100px;
            line-height: 1;
            color: rgba(199, 154, 50, .12);
        }

        .verse-text {
            position: relative;
            z-index: 2;
            font-family: "Amiri", serif;
            font-style: italic;
            font-weight: 700;
            font-size: 19px;
            line-height: 2;
            color: #293247;
        }

        .verse-ref {
            display: block;
            position: relative;
            z-index: 2;
            margin-top: 12px;
            text-align: left;
            color: var(--maroon);
            font-size: 12px;
            font-weight: 800;
        }

        /* =====================================================
           QUICK LINKS
        ===================================================== */

        .quick-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .quick-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: white;
            box-shadow: var(--shadow);
            transition: .2s ease;
            width: 100%;
            text-align: right;
        }

        .quick-link:active { transform: scale(.97); }

        .quick-link .icon-badge {
            width: 42px;
            height: 42px;
            font-size: 16px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            color: white;
            flex-shrink: 0;
            background: linear-gradient(145deg, var(--navy-light), var(--navy));
        }

        .quick-link.tone-maroon .icon-badge {
            background: linear-gradient(145deg, var(--maroon-light), var(--maroon));
        }

        .quick-link.tone-gold .icon-badge {
            background: linear-gradient(145deg, var(--gold-light), var(--gold));
            color: #4a3300;
        }

        .quick-link span {
            font-weight: 800;
            font-size: 13px;
            color: var(--text);
        }

        /* =====================================================
           BOTTOM NAV
        ===================================================== */

        .bottom-nav {
            position: fixed;
            z-index: 100;
            bottom: 11px;
            left: 50%;
            transform: translateX(-50%);
            width: min(620px, calc(100% - 22px));
            height: 72px;
            background: rgba(255, 255, 255, .97);
            border: 1px solid rgba(23, 37, 84, .08);
            border-radius: 26px;
            box-shadow: 0 17px 45px rgba(23, 37, 84, .15);
            display: flex;
            align-items: center;
            justify-content: space-around;
            backdrop-filter: blur(18px);
        }

        .nav-item {
            width: 62px;
            height: 55px;
            border: 0;
            background: none;
            border-radius: 17px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: #9ca4b2;
            font-size: 9px;
            font-family: "Tajawal", sans-serif;
            transition: .2s;
        }

        .nav-item i { font-size: 17px; }

        .nav-item.active {
            color: var(--navy);
            background: #eef2ff;
            font-weight: 800;
        }

        /* =====================================================
           ANIMATION
        ===================================================== */

        @keyframes heroIn {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 480px) {
            .main-hero { padding: 26px 18px; border-radius: 28px; }
            .quick-grid { grid-template-columns: 1fr 1fr; }
            .brand-text p { max-width: 170px; }
        }

    </style>

</head>

<body>

    <div class="page">

        <!-- =================================================
             TOP BAR
        ================================================== -->

        <header class="topbar">

            <div class="brand">

                <div class="brand-logo">
                    <i class="fa-solid fa-cross"></i>
                </div>

                <div class="brand-text">
                    <h1>مدرسة الشمامسة</h1>
                    <p>كنيسة الشهيد العظيم  مارجرجس بالمنصوره </p>
                </div>

            </div>

            <button class="top-btn" title="الإشعارات" onclick="navigateTo('notifications.html')">
                <i class="fa-regular fa-bell"></i>
                <span class="notif-dot" id="notifDot"></span>
            </button>

        </header>

        <!-- =================================================
             HERO / WELCOME
        ================================================== -->

        <section class="main-hero">

            <div class="hero-content">

                <div class="hero-avatar">
                    <img id="homeAvatar" src="" alt="صورتك الشخصية">
                </div>

                <h1 class="welcome-title" id="welcomeName">جاري التحميل...</h1>
                <p class="welcome-sub">نتمنى لك يوماً مباركاً</p>

            </div>

        </section>

        <!-- =================================================
             VERSE OF THE DAY
        ================================================== -->

        <div class="section-head">

            <div class="head-left">
                <div class="icon-badge"><i class="fa-solid fa-book-bible"></i></div>
                <div>
                    <h2>آية اليوم</h2>
                    <p>كلمة نتأمل فيها معاً</p>
                </div>
            </div>

        </div>

        <section class="verse">
            <p class="verse-text">"الرب نورى وخلاصى ممن أخاف؟ الرب حصن حياتى ممن أرتعب؟"</p>
            <span class="verse-ref">(مزمور ٢٧ : ١)</span>
        </section>

        <!-- =================================================
             QUICK LINKS
        ================================================== -->

        <div class="section-head">

            <div class="head-left">
                <div class="icon-badge"><i class="fa-solid fa-grip"></i></div>
                <div>
                    <h2>روابط سريعة</h2>
                    <p>أهم الأقسام اللي محتاجها</p>
                </div>
            </div>

        </div>

        <section class="quick-grid">

            <button class="quick-link" type="button" onclick="navigateTo('profile.html')">
                <div class="icon-badge"><i class="fa-solid fa-user"></i></div>
                <span>البروفايل</span>
            </button>

            <button class="quick-link tone-gold" type="button" onclick="navigateTo('gallery.html')">
                <div class="icon-badge"><i class="fa-solid fa-images"></i></div>
                <span>المعرض</span>
            </button>

            <button class="quick-link tone-maroon" type="button" onclick="navigateTo('cart.html')">
                <div class="icon-badge"><i class="fa-solid fa-heart"></i></div>
                <span>الطلبات</span>
            </button>

            <button class="quick-link" type="button" onclick="navigateTo('notifications.html')">
                <div class="icon-badge"><i class="fa-solid fa-bell"></i></div>
                <span>الإشعارات</span>
            </button>

        </section>

    </div>

    <!-- =====================================================
         BOTTOM NAVIGATION
    ====================================================== -->

    <nav class="bottom-nav">

        <button class="nav-item" onclick="navigateTo('profile.html')">
            <i class="fa-solid fa-user"></i>
            <span>البروفايل</span>
        </button>

        <button class="nav-item" onclick="navigateTo('gallery.html')">
            <i class="fa-solid fa-images"></i>
            <span>المعرض</span>
        </button>

        <button class="nav-item active" onclick="navigateTo('home.html')">
            <i class="fa-solid fa-house-chimney"></i>
            <span>الرئيسية</span>
        </button>

        <button class="nav-item" onclick="navigateTo('cart.html')">
            <i class="fa-solid fa-heart"></i>
            <span>الطلبات</span>
        </button>

        <button class="nav-item" onclick="navigateTo('notifications.html')">
            <i class="fa-solid fa-bell"></i>
            <span>الإشعارات</span>
        </button>

    </nav>

    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        /* =================================================
           FIREBASE
        ================================================= */

        const firebaseConfig = {
            apiKey: "AIzaSyDk8JXHvo9up6Hof7d6S_Or8ICnaGnuIUg",
            authDomain: "tony-c78c0.firebaseapp.com",
            projectId: "tony-c78c0",
            storageBucket: "tony-c78c0.firebasestorage.app",
            messagingSenderId: "182062544524",
            appId: "1:182062544524:web:59afdba4f0d1dfd929ada9",
            measurementId: "G-4FER9HW0JS"
        };

        firebase.initializeApp(firebaseConfig);

        const db = firebase.firestore();

        const USERS_COLLECTION = "users";


        /* =================================================
           NAVIGATION HELPER
        ================================================= */

        function navigateTo(page) {
            window.location.href = page;
        }


        /* =================================================
           CURRENT USER
        ================================================= */

        const currentUsername = (
            localStorage.getItem("currentUser") ||
            localStorage.getItem("current_servant_username") ||
            ""
        ).trim();

        const welcomeElement = document.getElementById("welcomeName");
        const avatarElement = document.getElementById("homeAvatar");


        async function loadHome() {

            if (!currentUsername) {
                welcomeElement.innerText = "خطأ: في تسجيل الدخول!";
                welcomeElement.classList.add("error-msg");
                avatarElement.src = "https://ui-avatars.com/api/?background=172554&color=f2d889&size=150";
                return;
            }

            try {

                const docRef = db.collection(USERS_COLLECTION).doc(currentUsername);
                const docSnap = await docRef.get();

                if (!docSnap.exists) {
                    welcomeElement.innerText = "خطأ: لم يتم العثور على المستخدم في قاعدة البيانات!";
                    welcomeElement.classList.add("error-msg");
                    avatarElement.src = "https://ui-avatars.com/api/?background=172554&color=f2d889&size=150";
                    return;
                }

                const userData = docSnap.data();
                const displayName = userData.displayUsername || userData.username || currentUsername;

                welcomeElement.innerText = `أهلاً بك يا ${displayName}`;

                if (userData.avatar) {
                    avatarElement.src = userData.avatar;
                } else {
                    avatarElement.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(displayName)}&background=172554&color=f2d889&size=150`;
                }

            } catch (error) {

                console.error("HOME LOAD ERROR:", error);
                welcomeElement.innerText = "خطأ في الاتصال بقاعدة البيانات!";
                welcomeElement.classList.add("error-msg");
                avatarElement.src = "https://ui-avatars.com/api/?background=172554&color=f2d889&size=150";

            }

        }

        loadHome();

    </script>

</body>

</html>
